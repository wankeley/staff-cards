<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #E3E6E7;
    --stage-line: #C9CDCA;
    --ink-1: #14161F;
    --ink-2: #1C1F2C;
    --paper: #F1EFE7;
    --muted: #9BA0A6;
    --muted-2: #656B78;
    --gold: #B8912F;
    --gold-soft: rgba(184, 145, 47, 0.22);
    --radius: 22px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--stage);
    background-image:
      linear-gradient(var(--stage-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--stage-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: center;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .stage-label {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted-2);
  }

  .card {
    position: relative;
    width: 360px;
    background: linear-gradient(165deg, var(--ink-2) 0%, var(--ink-1) 78%);
    border-radius: var(--radius);
    padding: 34px 30px 28px;
    color: var(--paper);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 30px 60px -20px rgba(10, 11, 16, 0.55);
    opacity: 0;
    transform: translateY(10px) scale(0.985);
    animation: rise 0.65s cubic-bezier(.2,.7,.2,1) forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }
  }

  /* clipped corner — badge/laminate detail */
  .card::before {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 46px; height: 46px;
    background: var(--stage);
    clip-path: polygon(100% 0, 0 0, 100% 100%);
    border-radius: 0 var(--radius) 0 0;
  }

  .eyebrow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.01em;
    margin-bottom: 30px;
    padding-right: 20px;
  }

  .eyebrow .org {
    font-weight: 500;
    color: var(--paper);
  }

  .monogram {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid var(--gold-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--gold);
    margin-bottom: 20px;
  }

  .name {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  .role {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 26px;
  }

  .rule {
    height: 1px;
    background: linear-gradient(90deg, var(--gold) 0%, transparent 65%);
    margin-bottom: 20px;
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 26px;
  }

  .contact a {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 10px;
    align-items: center;
    color: var(--paper);
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 4px 0;
    border: none;
    background: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }

  .contact a svg { width: 16px; height: 16px; stroke: var(--gold); flex-shrink: 0; }

  .contact a .copied-flag {
    margin-left: auto;
    font-size: 11px;
    color: var(--gold);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .contact a.copied .copied-flag { opacity: 1; }
  .contact a.copied span.value { color: var(--gold); }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 16px;
  }

  .footer .id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted-2);
    letter-spacing: 0.02em;
  }

  .footer .id b { color: var(--muted); font-weight: 500; }

  .footer .hint {
    font-size: 11px;
    color: var(--muted-2);
  }

  .not-found {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .not-found b { color: var(--paper); }
</style>
</head>
<body>

  <div class="card" id="card">
    <!-- populated by JS -->
  </div>

  <script>
    const DEMO_DATA = {
      "emp001": { name: "Jeffrey Ansah", position: "Systems Administrator", email: "jeffrey@example.com", phone: "+233000000000" },
      "emp002": { name: "Jane Doe", position: "HR Manager", email: "jane.doe@example.com", phone: "+233000000000" },
      "emp003": { name: "John Smith", position: "Sales Executive", email: "john.smith@example.com", phone: "+233000000000" }
    };

    const ORG_NAME = "Reiss & Co";

    function initials(name) {
      return name.split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
    }

    function iconMail() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>';
    }
    function iconPhone() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11 11 0 0 0 3.4.55 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .55 3.4 1 1 0 0 1-.24 1z"/></svg>';
    }

    function renderCard(id, data) {
      const el = document.getElementById("card");
      if (!data) {
        el.innerHTML = `
          <div class="eyebrow"><span class="org">${ORG_NAME}</span><span>Staff ID</span></div>
          <p class="not-found">No record found for id <b>${id || "(none)"}</b>. Check the link and try again.</p>
        `;
        return;
      }
      el.innerHTML = `
        <div class="eyebrow"><span class="org">${ORG_NAME}</span><span>Staff ID</span></div>
        <div class="monogram">${initials(data.name)}</div>
        <h1 class="name">${data.name}</h1>
        <p class="role">${data.position}</p>
        <div class="rule"></div>
        <div class="contact">
          <a href="mailto:${data.email}" data-copy="${data.email}">${iconMail()}<span class="value">${data.email}</span><span class="copied-flag">copied</span></a>
          <a href="tel:${data.phone}" data-copy="${data.phone}">${iconPhone()}<span class="value">${data.phone}</span><span class="copied-flag">copied</span></a>
        </div>
        <div class="footer">
          <span class="id"><b>${id}</b></span>
          <span class="hint">Tap to copy</span>
        </div>
      `;

      el.querySelectorAll(".contact a").forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          navigator.clipboard.writeText(a.dataset.copy).then(() => {
            a.classList.add("copied");
            setTimeout(() => a.classList.remove("copied"), 1200);
          });
        });
      });
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "emp001";
      try {
        const res = await fetch("staff.json");
        if (!res.ok) throw new Error("no staff.json");
        const staff = await res.json();
        renderCard(id, staff[id]);
      } catch (e) {
        // Fallback for local preview / missing staff.json
        renderCard(id, DEMO_DATA[id]);
      }
    }

    load();
  </script>
</body>
</html>
